services:
  postgres:
    image: postgres:16-alpine
    container_name: fieldsync-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fieldsync
      POSTGRES_PASSWORD: fieldsync
      POSTGRES_DB: fieldsync
    ports:
      - "5433:5432"
    volumes:
      - fieldsync_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fieldsync -d fieldsync"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  fieldsync_postgres_data:
